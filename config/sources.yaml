# Headroom — single source registry.
#
# Every source declares: bucket (a = present-but-dirty, b = absent/reconstructed),
# tier, a pinned source_version, and a `compliance` block. The compliance block is
# FAIL-CLOSED: `publishable` defaults to False when absent (see sources/registry.py),
# so a source is non-publishable until proven otherwise.
#
# `publishable: true`  -> public data, may appear in a shareable export, subject to
#                          its terms (compliance.basis). Every live export lists the
#                          terms of each source it used in NOTICE.md and in
#                          quality_report.json `attribution`. Publishable is not
#                          "unrestricted": SPP's terms, for one, allow non-commercial
#                          use with citation and need SPP's authorization otherwise.
# `publishable: false` -> may be fetched/stored and used INTERNALLY, but the
#                          lineage-walk export gate refuses to emit any value whose
#                          provenance transitively touches it under public_only=True.
#                          (CEII lives here. See provenance/gate.py.)
#
# Pilot region: SPP (see plan — fastest path to a defensible end-to-end loop).

sources:
  # ---- Bucket A: present-but-dirty (corroborate + validate) ----
  - name: pudl_ferc_form1
    bucket: a
    tier: 1
    kind: parquet
    gives: "Transmission asset inventory, line stats (pg 422), plant cost, O&M"
    access: "PUDL Parquet on S3"
    source_version: "pudl_v2024.11.0"
    compliance:
      publishable: true
      basis: "FERC Form 1 is a public filing; PUDL redistributes under CC-BY."
      notes: "Pinned PUDL release; never nightly for a shareable run."

  - name: eia_860_861
    bucket: a
    tier: 1
    kind: bulk
    gives: "Plant locations, balancing authority, generator nameplate. The pin's 2024 rows are EIA-860M (monthly), not annual EIA-860"
    access: "EIA-860 as redistributed in the pinned PUDL release (out_eia__yearly_plants, out_eia__yearly_generators); no key"
    source_version: "pudl_v2024.11.0:eia860_2024"
    compliance:
      publishable: true
      basis: "EIA survey data is public domain (US gov); this copy is PUDL's redistribution, released under CC-BY 4.0: attribute Catalyst Cooperative's Public Utility Data Liberation project."
      notes: "Read from the pinned PUDL release on S3, not from EIA directly."

  - name: hifld_transmission
    bucket: a
    tier: 3
    kind: gis
    gives: "Line geometry, voltages, substations"
    access: "HIFLD Open ArcGIS FeatureServer Electric_Power_Transmission_Lines (services1.arcgis.com/Hp6G80Pky0om7QvQ), anonymous"
    source_version: "hifld_open_2023-09-05"   # layer editingInfo.dataLastEditDate
    compliance:
      publishable: true
      basis: "HIFLD Open is public; transmission lines layer is openly licensed."
      notes: "Confirm the layer used is HIFLD Open, not the secured HIFLD tier."

  - name: eia_930
    bucket: a            # A-typed input that feeds the Bucket-B PTDF screen
    tier: 1
    kind: api
    gives: "Hourly load & interchange by balancing authority"
    access: "EIA-930 six-month bulk CSVs from the EIA Grid Monitor (EIA930_BALANCE_2024_*); no API key"
    source_version: "eia930_2024"
    compliance:
      publishable: true
      basis: "EIA-930 is public domain (US gov)."
      notes: ""

  # ---- Bucket B: absent (reconstruct from shadows / physics / exhaust) ----
  - name: spp_marketplace_lmp
    bucket: b
    tier: 1
    kind: api
    gives: "Nodal LMP -> congestion component"
    access: "SPP Integrated Marketplace public data (SPP Portal)"
    source_version: "spp_portal_2025-06"
    compliance:
      publishable: true
      basis: "SPP posts Integrated Marketplace data publicly on the SPP Portal. SPP Terms of Use (https://www.spp.org/terms-conditions/): non-commercial copying permitted with citation to SPP; commercial use requires SPP's prior written authorization."
      notes: "SPP terms of use (spp.org/terms-conditions): non-commercial copying and distribution permitted with citation; commercial use requires prior written authorization from SPP."

  - name: spp_binding_constraints
    bucket: b
    tier: 1
    kind: api
    gives: "Hourly DA binding constraints: shadow price ($/MWh), monitored and contingent facility"
    access: "SPP Portal file browser, da-binding-constraints /<year>/<MM>/DA-BC-MONTHLY-<year><MM>.csv.zip (the yearly file is incomplete), anonymous"
    source_version: "spp_da_bc_monthly_2025"
    compliance:
      publishable: true
      basis: "Hourly day-ahead binding-constraint shadow prices posted publicly on the SPP Portal. SPP Terms of Use (https://www.spp.org/terms-conditions/): non-commercial copying permitted with citation to SPP; commercial use requires SPP's prior written authorization."
      notes: "Core §6.1 signal: binding hours and shadow prices. SPP posts shadow prices here, not $; rent comes from spp_congestion_by_constraint. SPP terms of use (spp.org/terms-conditions): non-commercial copying and distribution permitted with citation; commercial use requires prior written authorization from SPP."

  - name: spp_congestion_by_constraint
    bucket: b
    tier: 1
    kind: api
    gives: "Monthly DA congestion $ per binding flowgate (sum over intervals of flow x shadow price)"
    access: "SPP Portal file browser, congestion-by-constraint /<year>/Congestion-Constraint-<year><MM>.csv, anonymous (page marked public)"
    source_version: "spp_cbc_2025"
    compliance:
      publishable: true
      basis: "Monthly cost of congestion by binding constraint, posted publicly on the SPP Portal. SPP Terms of Use (https://www.spp.org/terms-conditions/): non-commercial copying permitted with citation to SPP; commercial use requires SPP's prior written authorization."
      notes: "Observed rent for the rent signal and the EV model. SPP terms of use (spp.org/terms-conditions): non-commercial copying and distribution permitted with citation; commercial use requires prior written authorization from SPP."

  - name: spp_tcr_funding
    bucket: b
    tier: 1
    kind: api
    gives: "Monthly TCR funding by constraint: settled DA Collected, TCR Payout, Funding"
    access: "SPP Portal file browser, monthly-funding-by-constraint /<year>/TCR-CONSTRAINT-<year><MM>.csv, anonymous"
    source_version: "spp_tcr_funding_2025"
    compliance:
      publishable: true
      basis: "Monthly TCR funding by constraint, posted publicly on the SPP Portal. SPP Terms of Use (https://www.spp.org/terms-conditions/): non-commercial copying permitted with citation to SPP; commercial use requires SPP's prior written authorization."
      notes: "Calibration total only (settled DA congestion); no per-flowgate values used. SPP terms of use (spp.org/terms-conditions): non-commercial copying and distribution permitted with citation; commercial use requires prior written authorization from SPP."

  - name: spp_fca
    bucket: b
    tier: 3
    kind: report
    gives: "Frequently Constrained Areas — named, where the system binds"
    access: "SPP FCA study (PDF)"
    source_version: "fca_2024_2025-09"
    compliance:
      publishable: true
      basis: "Published SPP engineering study. SPP Terms of Use (https://www.spp.org/terms-conditions/): non-commercial copying permitted with citation to SPP; commercial use requires SPP's prior written authorization."
      notes: "§6.3 planning-exhaust ground truth. SPP terms of use (spp.org/terms-conditions): non-commercial copying and distribution permitted with citation; commercial use requires prior written authorization from SPP."

  - name: spp_itp
    bucket: b
    tier: 3
    kind: report
    gives: "ITP named constraints + proposed fixes + assigned costs"
    access: "SPP ITP Assessment report (PDF)"
    source_version: "itp_2024_v1.0"
    compliance:
      publishable: true
      basis: "Published SPP Integrated Transmission Planning assessment. SPP Terms of Use (https://www.spp.org/terms-conditions/): non-commercial copying permitted with citation to SPP; commercial use requires SPP's prior written authorization."
      notes: "§6.3 planning items -> planning_items table. SPP terms of use (spp.org/terms-conditions): non-commercial copying and distribution permitted with citation; commercial use requires prior written authorization from SPP."

  - name: spp_queue
    bucket: b
    tier: 3
    kind: export
    gives: "Where developers seek headroom; assigned upgrade costs"
    access: "SPP OPS portal GI active queue CSV (opsportal.spp.org/Studies/GenerateActiveCSV)"
    source_version: "spp_giq_2026-10-12"   # the CSV's "Last Updated On" date
    compliance:
      publishable: true
      basis: "SPP publishes the interconnection queue. SPP Terms of Use (https://www.spp.org/terms-conditions/): non-commercial copying permitted with citation to SPP; commercial use requires SPP's prior written authorization."
      notes: "demand_pressure signal. SPP terms of use (spp.org/terms-conditions): non-commercial copying and distribution permitted with citation; commercial use requires prior written authorization from SPP."

  # ---- Meta: fabricated test/demo data (NEVER publishable) ----
  # All fixture-derived values carry source: synthetic_fixture, so the lineage-walk
  # export gate refuses to emit a synthetic shortlist under public_only=True. A
  # synthetic run can only produce an INTERNAL (public_only=False) export. The
  # imitated real source is recorded in each value's `provider` field for
  # triangulation. This is what makes building on fabricated data safe.
  - name: synthetic_fixture
    bucket: meta
    tier: synthetic
    kind: fixture
    gives: "Fabricated SPP-SYNTH data for offline tests/demos"
    access: "tests/fixtures + data/raw (committed)"
    source_version: "synthetic"
    compliance:
      publishable: false
      basis: "Fabricated data. Not real observations; never publishable."
      notes: "Imitated real source is in each value's `provider` field."

  # ---- Quarantined non-public tier (present, but NEVER in a public export) ----
  # Example CEII source. Not used in v1. Listed so the lineage-walk gate has a
  # real non-publishable source to enforce against, and so adding CEII later is a
  # config change, not an architecture change. (Decision 5.)
  - name: ferc_form_715
    bucket: b
    tier: x
    kind: ceii
    gives: "Power-flow base cases (impedances, full topology)"
    access: "FERC CEII request + NDA"
    source_version: "ceii_unset"
    compliance:
      publishable: false
      basis: "CEII — Critical Energy/Electric Infrastructure Information."
      notes: >-
        DO NOT publish or let flow into any shareable export. May be ingested and
        used internally only; the lineage-walk export gate refuses anything whose
        provenance transitively touches this source under public_only=True.
