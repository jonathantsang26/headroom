# Headroom GET priors for SPP, 2026-10-13. Cited judgement, not observations.
# Full reasoning, sensitivity, audit change log and the citation table (ids such as dlr-33
# refer to it): docs/GET_PRIORS.md. Read by model/ev.py via config/regions/spp.scoring.yaml.
# Every source is skeptic-rated "with_caveats" except apfc-28 ("yes"); caveats are in the report.
# Money: 2025 USD. Source figures escalated with approximate CPI-U ratios (judgement): 2010-13 x1.40,
#   2016 x1.34, 2018 x1.28, 2021 x1.19, 2022 x1.10, 2024 x1.03. Nominal source years are named in each comment.
# Annualization: 6% REAL discount rate (judgement), capital recovery factor (CRF) plus O&M.
#   CRF(6%): 10y 0.1359, 12y 0.1193, 15y 0.1030, 20y 0.0872, 25y 0.0782.
#   lo/mode/hi costs all use the mid-life (DLR and TO software 12 y, APFC hardware 20 y); life is a sensitivity.
# DLR relief share is the increment over ambient-adjusted ratings (AAR, SPP baseline from 2027-04-01).
# TO relief share is EFFECTIVE: per-event flow relief x share of binding hours covered x saturation.
# One shared haircut, drawn independently of u (ev.py schema). h.hi is set so every single GET keeps
#   u.hi x h.hi <= 0.08 (to-35 cap); Combination can exceed it (see report s.7).
# line_radial and loopflow have no flowgates in the 2025 SPP data: their values are inert today.
version: "spp-get-priors-2026-10-13"
haircut:
  lo: 0.10    # judgement: derived floor = to-29 RT production-cost savings ~3% (2-5%) of the initial RT rent of the relieved constraints (Brattle/NewGrid SPP MWG 2018 slide 21; n=4 hand-picked severe snapshots, units fixed) / all-case average flow relief 26-31% at fixed dispatch (slide 17; 17 focus constraints x 20 cases, not the 4 simulated) => ~0.10 (0.065-0.19); the ratio also folds in a rent-to-production-cost conversion (to-29 verifier); a floor for DA R_f, which is rarely breach-priced (54 of 135,820 binding hours breached: Headroom SPP 2025 congestion-by-constraint snapshot 2026-10-13.r2, breached_hours, my count)
  mode: 0.35  # judgement: h(u) shadow-price-decline argument (worked example, report s.3: unbinding margin uniform 0-0.10, u = 0.08 => h ~0.31 linear supply, ~0.60 step supply); margins are often < 0.10 (DOE SGDP 2014 printed p.44: +5% removes up to 60% of target-line rent; dlr-13, rent basis, not h); directional only: net/own rent 0.38 (Murphy et al. CIGRE 2018 Table 1 p.6; dlr-85, rent basis, spillover only); APC saving / rent REDUCTION 0.32-0.37 (EPRI 3002013930 2018 Table 3-7; apfc-9; vs base rent 589 M$ only ~0.06-0.12)
  hi: 0.53    # judgement: the envelope argument alone allows h near 1 for small u (apfc-9 single PAC 0.92, directional only), but h.hi is set so u.hi 0.15 x h.hi <= 0.08: production-cost cost of congestion ~8.3% of DA rent caps u x h summed over flowgates (NewGrid et al. FERC AD10-12-007 2016 slides 15,19; to-35; PJM 2010, weekly system totals, not per flowgate); ev.py cannot enforce the cap jointly
gets:
  Dynamic Line Rating:
    relief_share:
      lo: 0.02    # judgement: sheltered or hot/calm-binding lines where DLR adds little over AAR in binding hours; like-for-like DLR below AAR 22%/27% of hours summer/winter (CIGRE-US 2021 Table 5 p.8; aar-2, one line, normal ratings); DLR >=7% below ILR in ~20% of hours, median line (NREL/PR-6A40-91599 2024 slide 26; aar-18; ILR = 0.61 m/s static wind with measured irradiance, not an Order 881 AAR); DLR below undefined 'traditional' ratings 20-40% of the time (EPRI 3002030550 2024 p.4; aar-37)
      mode: 0.08  # emergency-basis central ~0.10 x judgement ~0.8 day-ahead forecast margin (aar-18 ratings are real-time; SPP AARs are forecast over 240 h, aar-32): N-1 classes hold 98% of 2025 line rent ((1530.2+160.7)/1727.6 $M, Headroom SPP 2025 snapshot, my count) and bind on emergency ratings; PPL emergency gain over AAR 8.5-16.5% used directly (FERC RM24-6 ANOPR 2024 P57; dlr-33); normal-rating anchors x judgement 0.6-0.8 give 0.04-0.14 (Oncor 6-14%/8-12%: DOE SGDP 2014 Table 2 p.19, dlr-7; NG MA 16.3%: aar-2; PPL normal ~17%: dlr-33); NREL median line, median hour +8% vs ILR (slide 26; aar-18) as a low cross-check; wind/binding coincidence taken as net ~1 (judgement; dlr-21, syntheses-20)
      hi: 0.15    # judgement: Oncor cap 125% and next limit ~133% of STATIC (DOE SGDP 2014 Table 6, fn 9 p.28; dlr-10) are only ~9-16% over AAR in summer (AAR +15.1% over static) and ~22-30% in winter (+2.7%) (aar-2 Table 5); NREL 20%-of-hours +26% vs ILR (aar-18) through the same 0.6-0.8 and 0.8 => 0.12-0.17; keeps u.hi x h.hi <= 0.08 (to-35)
    annual_cost_musd:
      lo: 0.034   # capex $0.15M x CRF(6%,12y) 0.1193 + O&M ~$0.016M/yr (DOE Liftoff 2024 printed p.87: 20% of $70k licence + 10% of $15k sensors/telecom = $15.5k 2024$; syntheses-61, illustrative); capex: MISO TOs $0.1-0.2M/line 2021$ => $0.12-0.24M (FERC AD22-5 NOI 2022 p.10 fn 24; dlr-40, ex-ante); DOE NY ~$0.1-0.2M/segment (INL 2023 p.8; syntheses-89)
      mode: 0.10  # capex $0.6M (2025$) x 0.1193 + O&M ~$0.031M/yr (Liftoff ~$0.016M, syntheses-61, + judgement ~$0.015M allocated FTE/EMS integration); capex anchors escalated: PJM ~$0.5M 2018$ => ~$0.64M, excl. station upgrade (Murphy et al. CIGRE 2018 p.7; dlr-86); PPL <$0.5M per two-circuit corridor ~2021-22$ => <$0.6M, <$0.3M per circuit (FERC ANOPR P74; dlr-35); Liftoff ~$0.6M/line 2024$ (syntheses-60, illustrative); life 10-15 y, 12 central (DOE 2022 printed pp.60, 64; dlr-77, syntheses-11)
      hi: 0.26    # capex $1.5M x 0.1193 + judgement $0.08M/yr (upper tail charging part of an SPP TO's program cost, EMS upgrade up to $1M or $0.1-0.5M/yr SCADA, to one deployment: FERC AD22-5 NOI p.10; dlr-40, per TO, not per flowgate); capex judgement above BPA >$1M/line ~2021$ (NOI p.10; dlr-40) and Oncor ~$0.6M/circuit 2010-13$ => ~$0.85M with demo overheads (DOE SGDP 2014 Table 2; dlr-17), for long lines (APG ~$1.4M per ~100 km: INL 2022 p.23; dlr-55; length CEII)
    applicability:
      line_base: 0.45         # judgement within 0.3-0.6: conductor limiting 'about 42% of the time', transformers ~10% (DOE 2022 printed p.7, p.82, citing a 1996 NY report; dlr-80, weak, denominator undefined) => ~47% of non-transformer cases (derived: 0.42/0.90); 8 of 10 conductor-limited only AFTER a screen, 2 needed relay/breaker fixes (AES/LineVision 2024 Table 1 p.6; dlr-51, post-screen, not a base rate); PJM showcase line station-limited (Murphy et al. CIGRE 2018 p.5; dlr-87, n=1)
      line_n1: 0.40           # judgement: line_base x ~0.9 because lightly loaded pre-contingency lines defeat older sensor-based DLR (DOE SGDP 2014 printed p.v, p.10; dlr-15, stale tech, weak); an SPP N-1 161 kV flowgate was DLR-applicable (Mehraban et al. CIGRE 2018 p.1; dlr-82)
      line_n1_episodic: 0.35  # judgement: outage-driven binding on otherwise lightly loaded lines (dlr-15); DLR suits persistent needs (DOE SGDP 2014 printed p.41; dlr-21, qualitative)
      line_radial: 0.40       # judgement: DLR needs no parallel path, but relief may move to the next series segment (DOE 2022 printed p.40; dlr-76); inert (no SPP radial class in 2025 data)
      transformer_base: 0.0   # line ratings and AAR do not apply to transformers not in series with a line (SPP Operational Ratings Methodology 2025 printed p.3; aar-32); DLR acts on conductors only (CIGRE-US 2021 p.3; aar-35)
      transformer_n1: 0.0     # as transformer_base (aar-32, aar-35); dynamic transformer rating is a different technology
      interface: 0.10         # judgement: ~0.3 that a DLR-able conductor sets the multi-element limit (conductor only: aar-35; Exception for ambient-insensitive limits: aar-32; longer paths stability-limited: DOE DLR Report 2019 printed pp.23-24, dlr-3) x ~0.35 relief-size proxy, not a probability (one line's DLR lifts a multi-element limit only partly; u is shared across classes)
      loopflow: 0.30          # judgement: monitored element is a line, conductor-limited share as lines, discounted for externally driven binding; inert (no SPP loopflow class in 2025 data)
  Advanced Power Flow Control:
    relief_share:
      lo: 0.03    # EPRI SPP HPILS planning cases needed ~1-13% flow relief, sized to need (EPRI 3002013930 2018 Table 4-1 PDF p.114; apfc-1; cherry-picked viable cases)
      mode: 0.08  # judgement: DOE modelling assumption 10/17/25% average corridor capacity increase (DOE Liftoff 2024 fn 16 printed p.15, App. F printed p.83; apfc-46; sourced to DOE, the WATT Coalition (GET vendors) and interviews; applied to the 50% of lines assumed viable, so conditional on applicability), shaded to the 10% low case for binding hours (judgement, as the apfc-46 skeptic advises: parallel paths are loaded too) x judgement ~0.8 for preventive-only setpoints on N-1 flowgates (Telos CIGRE 2023 p.2; apfc-16) and setpoint-control risk (EPRI 2018 PDF p.70; apfc-11)
      hi: 0.15    # judgement: DOE high case 25% (apfc-46) x ~0.6 binding-hour and preventive shading; angle control saturates above ~15 deg (EPRI 2018 Table 3-8, PDF pp.89-90; apfc-12) as the structural cap; keeps u.hi x h.hi <= 0.08 (to-35)
    annual_cost_musd:
      lo: 0.16    # capex $1.5M x (CRF(6%,20y) 0.0872 + 2% O&M) = x0.1072; RMI ~$1.67M per overload 2024$ (RMI 2024 Exhibit 8 p.20; apfc-39; derived average, vendor-sized); EPRI SPP deferral cases $1.1-5.2M 2015-18$ => ~$1.4-7.1M (EPRI 2018 Exec Table 2 PDF p.17; apfc-4, low-biased by EPRI's own statement)
      mode: 0.86  # capex $8M x 0.1072; judgement between escalated planning estimates ($1.4-7.1M: apfc-4; VIC median ~$2.5M, derived from EPRI 2018 Table 3-18: apfc-7) and the one as-built point, VNI A$45M = ~US$31M 2022$ per cut-set (= per flowgate), ~US$15M per line, ~$34M 2025$ (Transgrid 2022; apfc-44; FX ~0.69 derived); life 20 y judgement between 12 y accounting (DOE 2022 printed p.64; apfc-64) and 25 y book (EPRI 2018 fn 3; apfc-8); O&M 2%/yr judgement for hardware upkeep (apfc-56: ~$5k/yr per 90 DSRs, software/comms only, physical maintenance unpriced; DOE $250k ongoing per GETs strategy, portfolio level: apfc-64)
      hi: 4.3     # capex $40M x 0.1072; PG&E ~2,000 DSRs ~$33M 2016$ => ~$44M for one 230 kV line (unbuilt; Brattle 2019 printed p.11 fn 41; apfc-56) and VNI ~$34M per flowgate (apfc-44); a single 345 kV PAC $19.4M 2018$ => ~$25M sits inside (EPRI 2018 Table 3-16; apfc-6); Sand Bar PST $48-66M (ISO-NE PAC 2024 slide 15; apfc-36) lies beyond
    applicability:
      line_base: 0.35         # judgement: needs a meshed parallel path with spare capacity (arXiv 1911.06677 2019 Sec 3.2.3 p.8; apfc-28; RMI 2024 p.14; syntheses-112; PJM APFC guide 2024 p.6; apfc-42); a base-case binding does not reveal a loop
      line_n1: 0.40           # judgement ~0.5 x judgement ~0.8: binding after a branch outage implies a loop; ~0.5 of loops have spare parallel headroom (context: DOE Liftoff 2024 App. F printed p.83, 50% of US lines 'economically viable', a Guidehouse assumption, US-wide, not SPP, recorded under apfc-46/apfc-51; refuted as a P in syntheses-43, so not a basis); x ~0.8 for equipment space (overhead lines with space only: DOE ATT 2020 printed pp.19-20; apfc-61) and setpoint management (apfc-11); some SPP N-1 load-pocket projects had no alternative path (EPRI 2018 PDF p.136; apfc-13); N-0 and N-1 eligible (syntheses-112)
      line_n1_episodic: 0.35  # judgement: as line_n1, discounted because a fixed preventive setpoint (apfc-16) is sized for a transient outage pattern
      line_radial: 0.0        # no parallel path, no thermal relief (apfc-28, skeptic 'yes'; syntheses-112; apfc-13)
      transformer_base: 0.15  # judgement: devices on parallel lines can divert flow around a transformer; EPRI SPP Case 2 needed a PAC where VIC was infeasible on a transformer-outage overload (EPRI 2018 PDF pp.117-119; apfc-2, image-only relief); thin support
      transformer_n1: 0.20    # judgement: as transformer_base; the one SPP case was a transformer-outage overload (apfc-2)
      interface: 0.25         # judgement: VNI relieved a cut-set (apfc-44), but interfaces are often voltage- or stability-limited (EPRI 2018 p.3-19, apfc-13; DOE ATT 2020 pp.19-20, apfc-61)
      loopflow: 0.35          # judgement: flow control is the classic loop-flow remedy, with no numeric support (apfc-51 gives no class ranking); inert (no SPP loopflow class in 2025 data)
  Topology Optimization:
    relief_share:
      lo: 0.02    # judgement: per-event ~0.07 (MISO outage cases 1-10% re-routed: Brattle 2021 slide 15, to-13; 7-8%: slide 16, to-14) x judgement coverage ~0.3 of binding hours x saturation ~1 at small relief
      mode: 0.07  # back-solved: 0.025 / h.mode 0.35, where 0.025 = to-29 per-event u x h ~0.03 (RT production-cost savings / initial RT rent, Brattle/NewGrid SPP MWG 2018 slide 21, n=4) x judgement coverage ~0.6 x judgement ~1.4 for the authors' stated lower bound (units fixed) and penalty-priced RT rent; cross-check (judgement): per-event ~0.20 (SPP study 26%/31%: Caspary et al. CIGRE 2019 pp.2,5, to-3; DARCLAANOFTS >20%: FERC AD10-12-011 2020 slide 15, to-4; Cimarron ~20%: to-9) x coverage 0.6 x saturation ~0.6 = 0.072
      hi: 0.15    # judgement: per-event ~0.25-0.40 (to-3 31% feasible mean; to-8 ~0.40, one derived constraint in one snapshot, FERC AD10-12-009 2018 slide 29; ISO-NE stated 31% avg, slides 6-7, 9, chart mean ~24%, median ~15% by verifier digitization, to-23) x coverage ~0.9 x saturation ~0.5 => 0.33 x 0.9 x 0.5 = 0.15 (physical per-event hi ~0.45); keeps u.hi x h.hi <= 0.08 (to-35)
    annual_cost_musd:
      lo: 0.05    # judgement: system ~$1.0M/yr / N ~100 relieved flowgates (judgement) + variable ~$0.04M; $1.0M/yr derived from DOE Liftoff $1.5M licence + 2x data uplift = $4.5M one-time x CRF(6%,12y) + 4 FTE x $120k (printed p.87, Table 11 p.84; to-65, to-66); variable: ISO labour at the variable-hours rate ~$0.034M (derived: 1,440 of 1,880 h x $180k / 4 EAPs, ERCOT NPRR1198 2024; to-70) + breaker wear ~$0.002M (to-73) + study ~$0.005M/yr ($43k derived: RMI 2024 Exhibit 8 $3.1M / 72 overloads, fee per project; to-67)
      mode: 0.175 # judgement: system ~$5M/yr SPP-wide / N ~50 + variable ~$0.075M; system = NESO vendor service GBP 1-5M/yr, mid ~$4M (NIA2_NESO087 2025 p.18; to-63) + Liftoff data uplift $3.0M x CRF(6%,12y) + 4 FTE x $120k = ~$0.84M/yr, licence excluded as it duplicates the vendor fee (to-65, to-66), ~$4.8M rounded to $5M; cross-check MISO $20M one-time proposal => ~$2.4M/yr at 6%/12 y (derived; OMS 2024 slide 12; to-68); variable: $180-220k/yr ERCOT-wide for ~4 EAPs => derived ~$45-55k per plan-year (to-70) + $10-100/cycle x judgement ~200 cycles/yr => ~$0.01M (Brattle 2021 slide 4; to-73) + study ~$0.005M + judgement ~$0.01M TO/TOP engineering
      hi: 0.87    # judgement: system ~$15M/yr / N ~20 + variable ~$0.12M; NESO vendor hi ~$6.7M/yr plus part of the integration labour NESO puts at ~70% of ADMS-type TCO (to-63; analogy; the full share would give ~$22M/yr); variable adds unpriced TO/TOP engineering ~$0.04M
    applicability:
      line_base: 0.15         # judgement: no SPP base-case evidence (all SPP study constraints are '(flo)': Brattle/NewGrid SPP MWG 2018 slides 16-18; to-84); TO solutions were found mostly for P1/P2/P4/P7 contingencies (RMI 2024 p.15; syntheses-113, to-85)
      line_n1: 0.30           # technical 0.55: SPP pilot found preferred single-switch solutions for 55 of 100 RT-congested flowgates (FERC AD10-12-011 2020 slide 13; to-83; strict screen, so a lower bound; PJM 5/10: to-85) x approval 0.56 = MISO market 10/16 x implemented 9/10 (MISO RSC 2025 slide 4; to-49); reliability stage (16/32) excluded because to-83's preferred solutions already passed SPP N-1 checks (judgement); cross-check MISO end-to-end 9/32 = 0.28 (0.28-0.31 after censoring), a P(implemented | vendor-screened submission); SPP adds production-cost, TCR and TOP tests (ER26-2592 2026 pp.14-16; to-82)
      line_n1_episodic: 0.35  # judgement: outage-driven congestion is where MISO's implemented reconfigurations concentrate (to-49, mostly outage-driven requests); temporary switching fits episodes (to-12, to-14)
      line_radial: 0.0        # TO applies only to meshed grids (RMI 2024 p.15; syntheses-113, to-85)
      transformer_base: 0.15  # judgement: as line_base
      transformer_n1: 0.30    # as line_n1; SPP transformer (flo) constraints were solved: Hawthorn XF20 and Nashua T1 (to-3, to-84), Cimarron (NewGrid 2024 case 4, recomputed from SPP chart data; to-9, syntheses-57)
      interface: 0.15         # judgement: ~0.3 applicability x ~0.5 relief-size proxy, not a probability (GB boundary relief 4.1-8.4% switching only, 3-12.3% with existing PSTs, under severe outages: NG NIA_NGET0169 via Brattle 2017 slide 12, to-20; syntheses-78; against single-element ~0.2-0.3: to-3)
      loopflow: 0.30          # judgement: external parallel flows on DARCLAANOFTS were relieved by switching (FERC AD10-12-011 2020 slide 15; to-4, syntheses-76); inert (no SPP loopflow class in 2025 data)
