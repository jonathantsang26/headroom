# SPP scoring: the default for `headroom run --region spp` (RegionConfig.scoring_path).
# config/scoring.yaml stays the fixture default and is unchanged.

# The shortlist is ranked by the expected net value of each flowgate's best GET
# (model/ev.py) under the cited priors in config/get_priors.yaml. The composite below
# is still computed and exported as a diagnostic, with its own rank stability
# (p_top_k_composite).
ranking: ev
get_priors: config/get_priors.yaml

weights:            # must sum to 1.0; order fixes RNG consumption
  rent: 0.35                # observed DA congestion $ (SPP congestion by constraint)
  loading: 0.20             # unobserved for SPP (element locations are CEII)
  persistence: 0.15         # binding hours
  demand_pressure: 0.15     # unobserved for SPP (needs element location)
  planning: 0.15            # unobserved for SPP (ITP needs are CEII/PDF)
  cost_of_inaction: 0.0     # rent x hours/8760: rent already sums over binding hours, so
                            # weighting it would count binding hours a third time. Still
                            # computed and exported (sig_cost_of_inaction).

# References: p99 (numpy linear) of each raw signal's expected value over the scored
# flowgates where it is observed, 4 significant figures, from the pinned snapshot
# below via scripts/derive_scoring_refs.py. Not tuned. Signals without an observed SPP
# population keep the fixture values (they normalize nothing here and must be > 0).
references:
  rent_ref_musd: 22.44
  persist_ref_hours: 1007.0
  coi_ref_musd: 1.949
  demand_ref_mw: 1000.0
  planning_cost_ref_musd: 200.0
  loading_ref: 1.0
reference_rule:
  rule: "p99 (numpy linear) of each raw signal's expected value over scored flowgates where the signal is observed, 4 significant figures"
  derived_from_snapshot: "2026-10-13"
  snapshot_manifest_sha256: "e2979f384497d264430b88f95b6c427a93d271269f6dafd1aef245c822f0d6fa"
  n_rent: 2054
  n_hours: 2072
  script: scripts/derive_scoring_refs.py

stability:
  draws: 10000
  top_fraction: 0.05   # shortlist = top 5% of flowgates (k ~ 104 of 2,072): an actionable
                       # list; the fixture file keeps 0.25 (k floors to 1 at small N)
  seed: 20260630
